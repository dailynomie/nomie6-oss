server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses
  gzip on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Hashed build files never change, so they can be cached for a year
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  # The app shell and the service worker must always be checked for updates
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }

  # Deep links such as /goals load the app shell, and the app routes them
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/security-headers.conf;
  }
}
