<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experiments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: flex-end">
      <button type="button" style="border: 0; background: none; padding: 0; font-size: 17px; font-weight: 600; color: {{t.tint}}; min-height: 44px">New</button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px">Experiments</h1>
    <div style="font-size: 15px; color: {{t.sec}}">Test one change. See what it does.</div>
    <div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 9px; background: {{t.fill}}; margin-top: 10px">
      <button type="button" aria-pressed="{{runPressed}}" style="border: 0; height: 30px; border-radius: 7px; background: {{runBg}}; color: {{t.label}}; font-size: 13px; font-weight: 600; box-shadow: {{runShadow}}">Running</button>
      <button type="button" aria-pressed="{{finPressed}}" style="border: 0; height: 30px; border-radius: 7px; background: {{finBg}}; color: {{t.label}}; font-size: 13px; font-weight: 600; box-shadow: {{finShadow}}">Finished</button>
    </div>
  </div>

  <div style="padding: 16px 16px 120px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{showRunning}}" hint-placeholder-val="{{ true }}">
      <div style="border-radius: 12px; background: {{t.card}}; overflow: hidden">
        <sc-for list="{{running}}" as="e" hint-placeholder-count="2">
          <a href="ExperimentDetail.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: {{e.rule}}">
              <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
                <span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: {{t.blueBg}}; color: {{t.blueFg}}">{{e.day}}</span>
              </span>
              <span role="progressbar" aria-label="{{e.progressLabel}}" style="display: block; height: 6px; border-radius: 3px; background: {{t.fill}}; overflow: hidden">
                <span style="display: block; width: {{e.pct}}; height: 100%; border-radius: 3px; background: {{t.tint}}"></span>
              </span>
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.sec}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 16px; flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showFinished}}" hint-placeholder-val="{{ false }}">
      <div style="border-radius: 12px; background: {{t.card}}; overflow: hidden">
        <sc-for list="{{finished}}" as="f" hint-placeholder-count="2">
          <a href="ExperimentDetail.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 0 0 16px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: {{f.rule}}">
              <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.title}}</span>
                <span style="flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: {{t.greyBg}}; color: {{t.greyFg}}">{{f.status}}</span>
              </span>
              <span style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-for list="{{f.outcomes}}" as="o" hint-placeholder-count="1">
                  <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: {{o.bg}}; color: {{o.fg}}">{{o.text}}</span>
                </sc-for>
              </span>
            </span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.sec}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 16px; flex-shrink: 0"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px">
    <dc-import name="TabBar" active="none" dark="{{isDark}}" hint-size="390px,83px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"view":{"editor":"enum","options":["running","finished"],"default":"running"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const view = this.props.view ?? 'running';
    const light = { bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', sec: '#6C6C70', fill: '#E3E3E8', seg: '#FFFFFF', sep: '#D8D8DC', tint: '#0A6CC9', blueBg: '#E3EFFB', blueFg: '#0A5BA8', greenBg: '#DDF3E2', greenFg: '#1E6B30', amberBg: '#FDF0D5', amberFg: '#7A4D00', greyBg: '#EEEEF2', greyFg: '#55555A', shadow: '0 2px 6px rgba(0,0,0,0.12)' };
    const night = { bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', sec: '#AEAEB2', fill: '#2C2C2E', seg: '#636366', sep: '#38383A', tint: '#4DB3FF', blueBg: '#0B2236', blueFg: '#7CC6FF', greenBg: '#123620', greenFg: '#5BE07F', amberBg: '#3A2A06', amberFg: '#FFD60A', greyBg: '#2C2C2E', greyFg: '#C7C7CC', shadow: '0 2px 6px rgba(0,0,0,0.5)' };
    const t = dark ? night : light;
    const rows = (list) => list.map((r, i) => ({ ...r, rule: i < list.length - 1 ? '0.5px solid ' + t.sep : '0' }));
    const running = rows([
      { title: 'No caffeine after 14:00', day: 'Day 9 of 14', pct: '64%', progressLabel: '9 of 14 days' },
      { title: '10-minute meditation', day: 'Day 3 of 21', pct: '14%', progressLabel: '3 of 21 days' }
    ]);
    const finished = rows([
      { title: 'No screens in the last hour before bed', status: 'Finished', outcomes: [{ text: 'sleep quality: A clear change, as you hoped.', bg: t.greenBg, fg: t.greenFg }] },
      { title: '30-minute walk each day', status: 'Finished', outcomes: [{ text: 'mood: No clear difference.', bg: t.greyBg, fg: t.greyFg }, { text: 'energy: Possibly a difference.', bg: t.amberBg, fg: t.amberFg }] },
      { title: 'No alcohol', status: 'Stopped early', outcomes: [{ text: 'sleep quality: Not enough data yet.', bg: t.greyBg, fg: t.greyFg }] }
    ]);
    const isRun = view === 'running';
    return {
      t, isDark: dark, running, finished,
      showRunning: isRun, showFinished: !isRun,
      runPressed: isRun ? 'true' : 'false', finPressed: isRun ? 'false' : 'true',
      runBg: isRun ? t.seg : 'transparent', finBg: isRun ? 'transparent' : t.seg,
      runShadow: isRun ? t.shadow : 'none', finShadow: isRun ? 'none' : t.shadow
    };
  }
}
</script>
</body>
</html>
