<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
input::placeholder{color:inherit;opacity:1}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 12px">
      <button type="button" aria-label="Jump to date" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: {{t.fill}}; color: {{t.label}}; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      </button>
      <button type="button" aria-label="Filter" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: {{t.fill}}; color: {{t.label}}; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
      </button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px">Timeline</h1>
    <label style="display: flex; align-items: center; gap: 6px; height: 36px; border-radius: 10px; padding: 0 8px; background: {{t.fill}}; color: {{t.sec}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search notes</span>
      <input type="search" placeholder="Search notes, #trackers, @people" style="border: 0; outline: none; background: transparent; font-size: 17px; flex: 1; color: {{t.sec}}; font-family: inherit">
    </label>
  </div>

  <div style="padding: 0 16px 100px 16px; display: flex; flex-direction: column">
    <sc-for list="{{days}}" as="day" hint-placeholder-count="2">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 22px 16px 7px 16px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{day.title}}</h2>
          <span style="font-size: 13px; color: {{t.sec}}">{{day.sub}}</span>
        </div>
        <div style="border-radius: 12px; background: {{t.card}}; overflow: hidden">
          <sc-for list="{{day.entries}}" as="e" hint-placeholder-count="3">
            <div style="display: flex; gap: 12px; padding: 12px 16px 0 16px">
              <div style="width: 40px; flex-shrink: 0; font-size: 13px; font-weight: 600; color: {{t.sec}}; padding-top: 2px; font-variant-numeric: tabular-nums">{{e.time}}</div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: {{e.rule}}">
                <div style="font-size: 15px; line-height: 20px">{{e.text}}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{e.chips}}" as="c" hint-placeholder-count="2">
                    <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 12px; background: {{t.fill}}; font-size: 13px">
                      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{c.color}}"></span>
                      <span>{{c.label}}</span>
                      <sc-if value="{{c.value}}" hint-placeholder-val="{{ true }}"><b style="font-weight: 700">{{c.value}}</b></sc-if>
                    </span>
                  </sc-for>
                </div>
                <sc-if value="{{e.place}}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: {{t.sec}}">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
                    <span>{{e.place}}</span>
                  </div>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px">
    <dc-import name="TabBar" active="timeline" dark="{{isDark}}" hint-size="390px,83px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const light = { bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', sec: '#6C6C70', fill: '#EEEEF2', sep: '#D8D8DC', tint: '#0A6CC9', bar: 'rgba(249,249,249,0.88)', barBorder: 'rgba(0,0,0,0.2)' };
    const night = { bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', sec: '#AEAEB2', fill: '#2C2C2E', sep: '#38383A', tint: '#4DB3FF', bar: 'rgba(22,22,24,0.88)', barBorder: 'rgba(255,255,255,0.16)' };
    const t = dark ? night : light;
    const col = { mood: '#8944AB', sleep: '#3634A3', water: '#0A6CC9', coffee: '#C25E00', walk: '#248A3D', meditate: '#0E7C86', person: '#C2185B', context: '#6C6C70', exp: t.tint };
    const days = [
      { title: 'Today', sub: 'Monday 19 October', entries: [
        { time: '21:40', text: 'Calm evening, phone away early.', chips: [{ label: 'Meditate', value: '10 min', color: col.meditate }, { label: '+evening', value: '', color: col.context }], place: '' },
        { time: '13:05', text: 'Walked to the park with Em at lunch.', chips: [{ label: 'Walk', value: '5.2 km', color: col.walk }, { label: '@em', value: '', color: col.person }, { label: '+outdoors', value: '', color: col.context }], place: 'Westerpark' },
        { time: '10:30', text: 'Coffee with Em before the stand-up.', chips: [{ label: 'Coffee', value: '1', color: col.coffee }, { label: '@em', value: '', color: col.person }, { label: '+work', value: '', color: col.context }], place: '' },
        { time: '08:12', text: 'Slept well, feeling rested.', chips: [{ label: 'Sleep', value: '7h 40m', color: col.sleep }, { label: 'Mood', value: '7', color: col.mood }], place: '' }
      ] },
      { title: 'Yesterday', sub: 'Sunday 18 October', entries: [
        { time: '22:10', text: 'No coffee after lunch today.', chips: [{ label: 'No caffeine after 14:00', value: 'Kept to it', color: col.exp }], place: '' },
        { time: '16:45', text: 'Long lunch, too much screen time after.', chips: [{ label: 'Mood', value: '6', color: col.mood }, { label: 'Water', value: '4', color: col.water }], place: '' }
      ] }
    ].map((d) => ({ ...d, entries: d.entries.map((e, i) => ({ ...e, rule: i < d.entries.length - 1 ? '0.5px solid ' + t.sep : '0' })) }));
    return { t, days, isDark: dark };
  }
}
</script>
</body>
</html>
