<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track, menu open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.9}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{bg}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <dc-import name="Main" dark="{{isDark}}" hint-size="390px,844px"></dc-import>
  </div>
  <a href="Main.dc.html" aria-label="Close menu" style="position: absolute; inset: 0; background: {{scrim}}; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px)"></a>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
    <a href="{{it.href}}" style="position: absolute; left: {{it.left}}; top: {{it.top}}; width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="position: relative; width: 54px; height: 54px; border-radius: 27px; background: {{card}}; color: {{tint}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.3)">
        <sc-if value="{{it.isGoals}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5.5"></circle><path d="M8.5 13.3L7 21l5-2.6 5 2.6-1.5-7.7"></path></svg>
        </sc-if>
        <sc-if value="{{it.isExperiments}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"></path></svg>
        </sc-if>
        <sc-if value="{{it.isPointers}}" hint-placeholder-val="{{ false }}">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l8 8-9 9z"></path><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"></circle></svg>
        </sc-if>
        <sc-if value="{{it.isLocations}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5l-5.5 2.5-6-2.5-5.5 2.5z"></path><path d="M9 4v13.5M15 6.5V20"></path></svg>
        </sc-if>
        <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; top: -4px; right: -8px; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: {{badgeBg}}; color: {{badgeFg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{it.badge}}</span>
        </sc-if>
      </span>
      <span style="padding: 3px 9px; border-radius: 10px; background: #1C1C1E; color: #FFFFFF; font-size: 12px; font-weight: 600; white-space: nowrap">{{it.label}}</span>
    </a>
  </sc-for>

  <a href="Main.dc.html" aria-label="Close menu" style="position: absolute; left: 166px; top: 748px; width: 58px; height: 58px; border-radius: 29px; background: {{tint}}; color: {{onTint}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.3)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["full","starter"],"default":"full"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const full = (this.props.mode ?? 'full') === 'full';
    const all = [
      { id: 'goals', label: 'Goals', badge: '3/4', href: 'Goals.dc.html' },
      { id: 'experiments', label: 'Experiments', badge: '2', href: 'Experiments.dc.html' },
      { id: 'pointers', label: 'Pointers', badge: '', href: 'Main.dc.html' },
      { id: 'locations', label: 'Locations', badge: '', href: 'Main.dc.html' }
    ].filter((i) => full || i.id !== 'pointers');
    const cx = 195, cy = 777, r = 118, start = 150, end = 30;
    const items = all.map((i, n) => {
      const angle = all.length <= 1 ? 90 : start - ((start - end) * n) / (all.length - 1);
      const rad = (angle * Math.PI) / 180;
      const x = cx + Math.cos(rad) * r, y = cy - Math.sin(rad) * r;
      return {
        ...i, hasBadge: !!i.badge,
        isGoals: i.id === 'goals', isExperiments: i.id === 'experiments', isPointers: i.id === 'pointers', isLocations: i.id === 'locations',
        left: Math.round(x - 48) + 'px', top: Math.round(y - 27) + 'px'
      };
    });
    return {
      items, isDark: dark,
      bg: dark ? '#000000' : '#F2F2F7',
      scrim: dark ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.38)',
      card: dark ? '#2C2C2E' : '#FFFFFF',
      tint: dark ? '#4DB3FF' : '#0A6CC9', onTint: dark ? '#000000' : '#FFFFFF',
      badgeBg: dark ? '#C7C7CC' : '#48484A', badgeFg: dark ? '#000000' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
