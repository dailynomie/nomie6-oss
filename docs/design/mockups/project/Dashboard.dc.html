<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: {{t.bg}}; color: {{t.label}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 54px 16px 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="height: 44px; display: flex; align-items: center; justify-content: flex-end">
      <button type="button" style="border: 0; background: none; padding: 0; font-size: 17px; color: {{t.tint}}; min-height: 44px">Edit</button>
    </div>
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px">Dashboard</h1>
    <div role="group" aria-label="Period" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 9px; background: {{t.fill}}; margin-top: 6px">
      <button type="button" style="border: 0; height: 30px; border-radius: 7px; background: transparent; color: {{t.label}}; font-size: 13px; font-weight: 500">Day</button>
      <button type="button" aria-pressed="true" style="border: 0; height: 30px; border-radius: 7px; background: {{t.seg}}; color: {{t.label}}; font-size: 13px; font-weight: 600; box-shadow: 0 2px 6px {{t.shadow}}">Week</button>
      <button type="button" style="border: 0; height: 30px; border-radius: 7px; background: transparent; color: {{t.label}}; font-size: 13px; font-weight: 500">Month</button>
    </div>
  </div>

  <div style="padding: 16px 16px 100px 16px; display: flex; flex-direction: column; gap: 12px">

    <div style="border-radius: 16px; background: {{t.card}}; padding: 14px 16px 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; align-items: center; gap: 6px; color: {{t.mood}}; font-size: 15px; font-weight: 600">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 14c1 1.3 2.1 1.9 3.5 1.9s2.5-.6 3.5-1.9"></path><path d="M9 9.5v.5M15 9.5v.5"></path></svg>
          <span>Mood</span>
        </div>
        <span style="font-size: 13px; color: {{t.sec}}">Average</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 4px">
        <span style="font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-size: 30px; font-weight: 700">6.3</span>
        <span style="font-size: 15px; color: {{t.sec}}">of 10 · up from 5.9</span>
      </div>
      <svg width="326" height="86" viewBox="0 0 326 86" role="img" aria-label="Mood this week: 6, 7, 6, 5, 7, 6, 7">
        <path d="{{moodArea}}" fill="{{t.moodFill}}"></path>
        <path d="{{moodLine}}" fill="none" stroke="{{t.mood}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
        <sc-for list="{{moodDots}}" as="p" hint-placeholder-count="7">
          <circle cx="{{p.x}}" cy="{{p.y}}" r="3.5" fill="{{t.card}}" stroke="{{t.mood}}" stroke-width="2"></circle>
        </sc-for>
      </svg>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 11px; color: {{t.sec}}; text-align: center">
        <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="border-radius: 16px; background: {{t.card}}; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; color: {{t.sleep}}; font-size: 15px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"></path></svg>
          <span>Sleep</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 3px">
          <span style="font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-size: 24px; font-weight: 700">7h 12m</span>
        </div>
        <span style="font-size: 12px; color: {{t.sec}}">Average a night</span>
        <div role="img" aria-label="Sleep per night this week, between 6 and 8 hours" style="display: flex; align-items: flex-end; gap: 5px; height: 54px; margin-top: 4px">
          <sc-for list="{{sleepBars}}" as="b" hint-placeholder-count="7">
            <span style="flex: 1; border-radius: 4px; height: {{b.h}}; background: {{b.c}}"></span>
          </sc-for>
        </div>
      </div>

      <div style="border-radius: 16px; background: {{t.card}}; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; color: {{t.water}}; font-size: 15px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s6 6.4 6 10.7a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5z"></path></svg>
          <span>Water</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
          <svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="6 of 8 cups today">
            <circle cx="36" cy="36" r="29" fill="none" stroke="{{t.waterFill}}" stroke-width="10"></circle>
            <circle cx="36" cy="36" r="29" fill="none" stroke="{{t.water}}" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{waterDash}}" transform="rotate(-90 36 36)"></circle>
          </svg>
          <div style="display: flex; flex-direction: column">
            <span style="font-family: ui-rounded, -apple-system, system-ui, sans-serif; font-size: 24px; font-weight: 700">6</span>
            <span style="font-size: 12px; color: {{t.sec}}">of 8 cups today</span>
          </div>
        </div>
      </div>
    </div>

    <a href="ExperimentDetail.dc.html" style="border-radius: 16px; background: {{t.card}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 34px; height: 34px; border-radius: 9px; background: {{t.tintFill}}; color: {{t.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"></path><path d="M7.5 15h9"></path></svg>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 600">No caffeine after 14:00</div>
          <div style="font-size: 13px; color: {{t.sec}}">Day 9 of 14</div>
        </div>
      </div>
      <div role="progressbar" aria-label="Experiment progress" aria-valuemin="0" aria-valuemax="14" aria-valuenow="9" style="height: 6px; border-radius: 3px; background: {{t.fill}}; overflow: hidden">
        <div style="width: 64%; height: 100%; border-radius: 3px; background: {{t.tint}}"></div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 13px; color: {{t.sec}}">Kept to it <b style="color: {{t.label}}">8</b> of 9 days</span>
        <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 10px; background: {{t.amberBg}}; color: {{t.amberFg}}">Sleep quality: possibly a difference</span>
      </div>
    </a>

    <div style="border-radius: 16px; background: {{t.card}}; padding: 14px 16px 4px 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px">
        <span style="font-size: 15px; font-weight: 600">Goals today</span>
        <span style="font-size: 13px; color: {{t.sec}}">3 of 4</span>
      </div>
      <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 40px; border-top: 0.5px solid {{t.sep}}">
          <sc-if value="{{g.done}}" hint-placeholder-val="{{ true }}">
            <span style="width: 22px; height: 22px; border-radius: 11px; background: {{t.good}}; color: {{t.onGood}}; display: flex; align-items: center; justify-content: center">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </span>
          </sc-if>
          <sc-if value="{{g.open}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 11px; border: 2px solid {{t.sec}}"></span>
          </sc-if>
          <span style="flex: 1; font-size: 15px">{{g.label}}</span>
          <span style="font-size: 13px; color: {{t.sec}}">{{g.detail}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px">
    <dc-import name="TabBar" active="dashboard" dark="{{isDark}}" hint-size="390px,83px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const light = { bg: '#F2F2F7', card: '#FFFFFF', label: '#000000', sec: '#6C6C70', fill: '#E3E3E8', seg: '#FFFFFF', sep: '#D8D8DC', tint: '#0A6CC9', onTint: '#FFFFFF', mood: '#8944AB', moodFill: 'rgba(137,68,171,0.12)', sleep: '#3634A3', sleepSoft: '#C9C8EE', water: '#0A6CC9', waterFill: '#DCEAF8', good: '#1E7A34', onGood: '#FFFFFF', bar: 'rgba(249,249,249,0.88)', barBorder: 'rgba(0,0,0,0.2)', shadow: 'rgba(0,0,0,0.12)' };
    const night = { bg: '#000000', card: '#1C1C1E', label: '#FFFFFF', sec: '#AEAEB2', fill: '#2C2C2E', seg: '#636366', sep: '#38383A', tint: '#4DB3FF', onTint: '#000000', mood: '#DA8FFF', moodFill: 'rgba(218,143,255,0.16)', sleep: '#A5A3FF', sleepSoft: '#34335E', water: '#4DB3FF', waterFill: '#14324B', good: '#30D158', onGood: '#000000', bar: 'rgba(22,22,24,0.88)', barBorder: 'rgba(255,255,255,0.16)', shadow: 'rgba(0,0,0,0.5)' };
    const t = dark ? night : light;
    const mood = [6, 7, 6, 5, 7, 6, 7];
    const x = (i) => 23 + i * 46.67, y = (v) => 78 - ((v - 4) / 4) * 66;
    const pts = mood.map((v, i) => ({ x: x(i).toFixed(1), y: y(v).toFixed(1) }));
    const moodLine = pts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join(' ');
    const moodArea = moodLine + ' L' + pts[6].x + ' 86 L' + pts[0].x + ' 86 Z';
    const sleep = [7.6, 6.8, 7.2, 6.1, 7.5, 8.0, 7.3];
    const sleepBars = sleep.map((h, i) => ({ h: Math.round((h - 4) / 4 * 54) + 'px', c: i === 6 ? t.sleep : t.sleepSoft }));
    const circ = 2 * Math.PI * 29;
    const waterDash = (circ * 6 / 8).toFixed(1) + ' ' + circ.toFixed(1);
    const goals = [
      { label: 'Walk 5 km', detail: '5.2 km', done: true, open: false },
      { label: 'Meditate', detail: 'Due tonight', done: false, open: true },
      { label: 'Meds', detail: 'Done', done: true, open: false },
      { label: 'Two coffees at most', detail: '1 so far', done: true, open: false }
    ];
    t.tintFill = dark ? '#0B2236' : '#E3EFFB';
    t.amberBg = dark ? '#3A2A06' : '#FDF0D5';
    t.amberFg = dark ? '#FFD60A' : '#7A4D00';
    return { t, moodLine, moodArea, moodDots: pts, sleepBars, waterDash, goals, isDark: dark };
  }
}
</script>
</body>
</html>
